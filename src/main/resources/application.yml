spring:
  application:
    name:
      ecommerce-api
  datasource:
    url:
      ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username:
      ${DB_USERNAME:postgres}
    password:
      ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none

    open-in-view: false
    show-sql: false
  flyway:
    enabled: true










